<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Sup Dashboard</title>
        <link rel="stylesheet" href="/static/theme.css" />
    </head>

    <body>
        <div class="container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th scope="col" class="cell-shrink">Name</th>
                        <th scope="col" class="cell-shrink col-kind-header">
                            Kind
                        </th>
                        <th scope="col" class="cell-shrink col-type-header">
                            Type
                        </th>
                        <th scope="col">State</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Nodes}}
                    <tr>
                        <td class="cell-shrink">
                            <span class="row-name">{{.Name}}</span>
                        </td>
                        <td class="cell-shrink col-kind">
                            <span
                                class="badge badge-kind"
                                data-kind="{{.Spec.Kind}}"
                            >
                                {{.Spec.Kind}}
                            </span>
                        </td>
                        <td class="cell-shrink col-type">
                            <span
                                class="badge badge-type"
                                data-type="{{.Type}}"
                            >
                                {{.Type}}
                            </span>
                        </td>
                        <td class="col-state">
                            <div
                                class="state-val"
                                data-name="{{.Name}}"
                                data-kind="{{.Spec.Kind}}"
                                data-type="{{.Type}}"
                                data-value="{{formatValue .Value}}"
                                title="{{formatValue .Value}}"
                            >
                                <span class="state-text">
                                    {{formatValue .Value}}
                                </span>
                            </div>
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>

        <script src="/static/dashboard.js" defer></script>
    </body>
</html>
